name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate tag ref
        run: |
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != v* ]]; then
            echo "::error::Release must be triggered by a v* tag push. For manual dispatch, use: gh workflow run release.yml --ref v1.2.3"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Check tag matches pyproject version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $VERSION"
            exit 1
          fi
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  test-install:
    needs: testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Fetch and verify this run's wheel from TestPyPI
        # Verify before installing: a wheel can carry .pth files that run at
        # every Python start, so nothing from TestPyPI is installed until its
        # bytes match this run's build. skip-existing keeps reruns working;
        # the hash comparison keeps them honest. No package code runs here.
        run: |
          python - "${GITHUB_REF_NAME#v}" <<'EOF'
          import hashlib, json, pathlib, sys, time, urllib.error, urllib.request
          version = sys.argv[1]
          url = f"https://test.pypi.org/pypi/punt-oo-ratchet/{version}/json"
          built = {d.name: hashlib.sha256(d.read_bytes()).hexdigest()
                   for d in pathlib.Path("dist").iterdir()}
          served = {}
          for attempt in range(1, 11):
              try:
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      served = {f["filename"]: f for f in json.load(resp)["urls"]}
                  if set(built) <= set(served):
                      break
                  print(f"Attempt {attempt}: TestPyPI lists {sorted(served)}; waiting")
              except (urllib.error.URLError, TimeoutError) as err:
                  print(f"Attempt {attempt}: {err}; waiting")
              time.sleep(60)
          else:
              sys.exit(f"::error::TestPyPI never listed {sorted(built)} for {version}")
          for name, digest in built.items():
              if served[name]["digests"]["sha256"] != digest:
                  sys.exit(f"::error::TestPyPI {name} is not this run's build; bump the version")
          wheel = next(n for n in built if n.endswith(".whl"))
          with urllib.request.urlopen(served[wheel]["url"], timeout=60) as resp:
              data = resp.read()
          if hashlib.sha256(data).hexdigest() != built[wheel]:
              sys.exit(f"::error::downloaded {wheel} does not match this run's build")
          dest = pathlib.Path("verified") / wheel
          dest.parent.mkdir()
          dest.write_bytes(data)
          print(f"Verified {sorted(built)}; downloaded {wheel}")
          EOF
      - name: Install the verified wheel alone
        # --no-deps: nothing but punt-oo-ratchet may come from TestPyPI, where
        # anyone can publish a higher version of a dependency's name.
        run: uv pip install --system --no-deps verified/*.whl
      - name: Install its dependencies from PyPI only
        # The requirement list comes from the installed package's own metadata,
        # so it never drifts from pyproject.toml.
        run: |
          python -c "import importlib.metadata as m; print('\n'.join(m.requires('punt-oo-ratchet') or []))" > requirements.txt
          cat requirements.txt
          uv pip install --system --index-url https://pypi.org/simple/ -r requirements.txt
      - name: Verify CLI
        run: oo-ratchet --help

  pypi:
    needs: test-install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
