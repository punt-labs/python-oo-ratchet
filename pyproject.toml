[project]
name = "punt-oo-ratchet"
version = "0.7.0"
description = "Must-improve OO quality ratchet for Python repos: OO metrics, coupling/cohesion, and lint-suppression count gates."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Punt Labs" }]
dependencies = ["punt-observe==0.1.1"]

[project.urls]
Homepage = "https://github.com/punt-labs/python-oo-ratchet"
Repository = "https://github.com/punt-labs/python-oo-ratchet"
"Bug Tracker" = "https://github.com/punt-labs/python-oo-ratchet/issues"

[project.scripts]
oo-ratchet = "oo_ratchet.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.18.1",
    "pyright>=1.1.400",
    "pytest>=8.4",
    "ruff>=0.13.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "oo_ratchet"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests", "docs/architecture/tools"]
markers = [
    "slow: tests that drive real tmp git repos (run with -m slow)",
]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
extraPaths = ["."]

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownMemberType = false

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "TID",  # flake8-tidy-imports
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit (security)
    "BLE",  # flake8-blind-except
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "LOG",  # flake8-logging (PY-LOG-2, PY-LOG-9)
    "G",    # flake8-logging-format: lazy %-style arguments only
    "A",    # flake8-builtins
    "ERA",  # flake8-eradicate (commented code)
    "PIE",  # flake8-pie
    "RSE",  # flake8-raise
    "ARG",  # flake8-unused-arguments
    "RET",  # flake8-return
    "PERF", # perflint
    "PTH",  # flake8-use-pathlib
    "ISC",  # flake8-implicit-str-concat
    "FBT",  # flake8-boolean-trap
    "C90",  # mccabe complexity
]
extend-select = ["PLC0415"]

ignore = [
    "TC001",  # Move import into TYPE_CHECKING - too aggressive
    "TC003",  # Move standard lib import into TYPE_CHECKING
]


[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S603", "S607", "T20", "SLF001", "ARG", "FBT", "PLC0415", "C901"]
"src/oo_ratchet/**" = ["S603", "S607", "C901", "PERF403", "SIM102", "N806", "C420"]

[tool.ruff.lint.mccabe]
max-complexity = 10
[tool.oo-ratchet.layers]
entry = [
  "oo_ratchet",
  "oo_ratchet.__main__",
  "oo_ratchet.gates",
  "oo_ratchet.logging_config",
  "oo_ratchet.usage",
  "oo_ratchet.telemetry_settings",
  "oo_ratchet.*.cli",
]
adapters = [
  "oo_ratchet.*.gitio",
  "oo_ratchet.*.baseline",
  "oo_ratchet.*.audit",
  "oo_ratchet.*.report",
  "oo_ratchet.*.outcome",
  "oo_ratchet.*.persist",
  "oo_ratchet.*.pyproject",
  "oo_ratchet.*.config",
  "oo_ratchet.*.base_config",
  "oo_ratchet.*.base_modules",
  "oo_ratchet.*.failures",
  "oo_ratchet.*.suggest",
  "oo_ratchet.*.suggest_facts",
  "oo_ratchet.*.suggest_rules",
  "oo_ratchet.*.suggest_table",
  "oo_ratchet.*.output",
  "oo_ratchet.*.layout",
  "oo_ratchet.*.tree",
  "oo_ratchet.*.trees",
  "oo_ratchet.*.package_tree",
  "oo_ratchet.*.listing",
  "oo_ratchet.*.gateinput",
  "oo_ratchet.*.legacy_shadow",
  "oo_ratchet.*.namespace_shadow",
  "oo_ratchet.gate_options",
  "oo_ratchet.source_archive",
  "oo_ratchet.source_history",
  "oo_ratchet.source_set",
  "oo_ratchet.sources",
  "oo_ratchet.core.adapters.*",
]
application = [
  "oo_ratchet.core.application.*",
  "oo_ratchet.backfill",
  "oo_ratchet.*.ratchet",
  "oo_ratchet.*.compare",
  "oo_ratchet.*.bless",
  "oo_ratchet.*.relax",
  "oo_ratchet.*.writer",
  "oo_ratchet.*.rescan",
  "oo_ratchet.*.apply",
  "oo_ratchet.*.adoption",
  "oo_ratchet.*.verdict",
  "oo_ratchet.*.diagram",
  "oo_ratchet.*.widening",
  "oo_ratchet.*.chain",
  "oo_ratchet.*.comparison",
  "oo_ratchet.*.delta",
  "oo_ratchet.*.scan",
  "oo_ratchet.*.shadow",
  "oo_ratchet.*.shadow_scan",
  "oo_ratchet.*.shadow_report",
]
domain = [
  "oo_ratchet.core.domain.*",
  "oo_ratchet.*",
]
